<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LSPD · Page not found</title>
<style>
:root{--bg:#0b0f16;--steel:#121a26;--hair:rgba(255,255,255,.1);--tx:#dbe4f3;--mute:#8a98ae;--blue:#3f7fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(600px 420px at 50% 40%,rgba(63,127,255,.14),transparent 70%),var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.box{width:min(460px,100%);border:1px solid var(--hair);background:var(--steel);padding:26px 24px 24px;text-align:center;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(63,127,255,.4))}
.code{margin:10px 0 2px;font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.3em;color:var(--blue)}
h1{margin:0 0 8px;font-size:22px;letter-spacing:.04em}
p{margin:0 0 20px;color:var(--mute)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:11px 18px;font-weight:700;letter-spacing:.06em;text-decoration:none;border:1px solid var(--hair);color:var(--tx)}
a.go{background:var(--blue);border-color:var(--blue);color:#fff}
a:hover{filter:brightness(1.12)}
</style>
</head>
<body>
<div class="box">
  <img src="/img/lspd-badge.png" alt="LSPD">
  <div class="code">10-22 · 404</div>
  <h1>That page isn't on file</h1>
  <p>The link may be old or mistyped. Head back to the portal and pick up from there.</p>
  <div class="btns">
    <a class="go" href="/">Back to the portal</a>
    <a href="/myreports.html">My reports</a>
  </div>
</div>
</body>
</html>
