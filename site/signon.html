<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f16">
<title>Sign on · LSPD MDT</title>
<link rel="icon" href="img/lspd-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0f16;--steel:#121925;--steel2:#18212f;--hair:rgba(160,184,220,.13);--hair2:rgba(160,184,220,.22);
  --tx:#dfe6f2;--mute:#8592a8;--dim:#5d6a80;--blue:#3f7fff;--amber:#f0b43c;--green:#3ad18a;--red:#ff5a5f;--disc:#5865f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;min-height:100vh;padding:24px 16px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(640px 460px at 50% 40%,rgba(63,127,255,.15),transparent 70%);pointer-events:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);z-index:3}
.boot{width:100%;max-width:540px;min-width:0;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.top img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(63,127,255,.45))}
.top b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em}
.top b i{font-style:normal;color:var(--blue)}
.top small{display:block;margin-top:6px;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.32em;color:var(--mute)}
.clip{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.term{border:1px solid var(--hair2);background:rgba(8,12,19,.85);padding:14px 16px;font:12px/1.8 "JetBrains Mono",monospace;color:#b9c6dc;height:182px;overflow:hidden}
.term .hx{color:#4f6a94} .term .hx b{color:#7fa6e8;font-weight:400} .term .n{color:#cfe0ff}
.term div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .t{color:var(--dim);margin-right:8px}
.term .ok{color:var(--green)} .term .w{color:var(--amber)} .term .x{color:var(--red)}
.term .cur::after{content:"█";color:var(--blue);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.prog{display:flex;align-items:center;gap:12px;margin-top:12px}
.prog div{flex:1;height:3px;background:rgba(255,255,255,.08)}
.prog i{display:block;height:100%;width:0;background:var(--blue);box-shadow:0 0 12px var(--blue);transition:width .35s}
.prog .link{width:auto;text-align:left;font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.18em;color:var(--red);white-space:nowrap}
.prog .link.amber{color:var(--amber)} .prog .link.green{color:var(--green);text-shadow:0 0 8px rgba(58,209,138,.5)}
.term .k{color:#9fe3c4} .term .sig{color:var(--amber);letter-spacing:1px}
.prog span{font:600 11.5px "JetBrains Mono",monospace;color:var(--mute);width:38px;text-align:right}
.card{margin-top:16px;border:1px solid var(--hair2);background:linear-gradient(180deg,var(--steel2),var(--steel));padding:20px 22px 22px;animation:rise .35s ease-out}
.card[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card h2{font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.card p.sub{color:var(--mute);font-size:13px;margin:4px 0 18px}
.who{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--hair);background:rgba(0,0,0,.2);margin-bottom:18px}
.who .cs{font:600 13px "JetBrains Mono",monospace;color:#cfe0ff;padding:3px 8px;border:1px solid rgba(63,127,255,.45);background:rgba(63,127,255,.12)}
.who b{font-weight:600}
.who small{display:block;color:var(--mute);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border:0;cursor:pointer;font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--blue);clip-path:polygon(0 0,100% 0,100% 70%,96% 100%,0 100%);transition:filter .15s}
.btn:hover{filter:brightness(1.12)} .btn:disabled{filter:grayscale(.6) brightness(.7);cursor:wait}
.btn.disc{background:var(--disc)}
.btn svg{width:22px;height:22px;fill:currentColor}
.msg{margin-top:12px;padding:9px 12px;font-size:13px;border-left:3px solid var(--red);background:rgba(255,90,95,.08);color:#ffd0d1}
.msg.info{border-color:var(--amber);background:rgba(240,180,60,.08);color:#f6e2b6}
.msg[hidden]{display:none}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.links a{color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.links a:hover{color:var(--tx)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:3px;background:rgba(255,255,255,.1)} .steps span.on{background:var(--blue)}
/* PIN pad */
.dots{display:flex;justify-content:center;gap:16px;margin:4px 0 18px}
.dots i{width:16px;height:16px;border:2px solid var(--hair2);transform:rotate(45deg);transition:.12s}
.dots i.on{background:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(63,127,255,.6)}
.dots.bad{animation:shake .35s} .dots.bad i{border-color:var(--red)}
.dots.good i{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(58,209,138,.6)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.pad button{height:56px;border:1px solid var(--hair2);background:#0d131d;color:var(--tx);font:600 22px "JetBrains Mono",monospace;cursor:pointer;transition:background .1s,border-color .1s}
.pad button:hover{border-color:rgba(63,127,255,.5)}
.pad button:active,.pad button.hit{background:rgba(63,127,255,.22);border-color:var(--blue)}
.pad button.fn{font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.16em;color:var(--mute)}
.pad.busy{opacity:.5;pointer-events:none}
.ok-big{display:flex;align-items:center;gap:14px}
.ok-big i{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--green);color:var(--green);font:700 22px Inter;font-style:normal;flex:none}
.foot{margin-top:16px;display:flex;justify-content:space-between;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.2em;color:var(--dim)}
.skip{position:fixed;right:18px;bottom:16px;z-index:4;font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.2em;color:var(--mute);border:1px solid var(--hair2);background:rgba(11,15,22,.8);padding:8px 14px;cursor:pointer}
.skip[hidden]{display:none}
.snd{position:fixed;left:16px;bottom:16px;z-index:4;width:38px;height:34px;border:1px solid var(--hair2);background:rgba(11,15,22,.8);color:var(--mute);cursor:pointer;font-size:15px}
.snd:hover{color:var(--tx)} .snd.off{opacity:.55}
.power{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:152px;width:100%;border:0;background:none;color:var(--tx);cursor:pointer;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.24em}
.power i{width:46px;height:46px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;color:var(--blue);box-shadow:0 0 18px rgba(63,127,255,.45);animation:pulse 1.6s ease-in-out infinite}
.power i svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.power:active i{transform:scale(.92)}
.power small{font:500 11px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--dim)}
.power:hover i{background:rgba(63,127,255,.15)}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(63,127,255,.2)}}
body.is-demo{padding-top:52px}
.demo{position:fixed;left:0;right:0;top:0;z-index:5;text-align:center;padding:5px;font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.2em;background:var(--amber);color:#1a1200}
@media(max-width:480px){.top img{width:56px;height:56px}.top b{font-size:25px}.card{padding:18px 16px 18px}.term{font-size:11px}.pad button{height:60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="crt"></div>
<div class="boot">
  <div class="top"><img src="img/lspd-badge.png" alt=""><div><b>LSPD <i>::</i> MDT</b><small>MOBILE DATA TERMINAL</small></div></div>
  <div class="term clip" id="term" aria-live="polite"></div>
  <div class="prog"><span class="link" id="link">● UNSECURED</span><div><i id="bar"></i></div><span id="pct">0%</span></div>
  <div class="card clip" id="card" hidden></div>
  <div class="foot"><span>MISSION ROW · LOS SANTOS</span><span id="watch"></span></div>
</div>
<button class="skip" id="skip" type="button">SKIP ▸</button>
<button class="snd" id="snd" type="button" title="Sound on/off" aria-label="Sound on/off">🔊</button>

<script src="forms.js?v=202610200937"></script>
<script>
(function () {
  "use strict";
  const DEMO = /[?&]demo=1\b/.test(location.search);
  const P = DEMO ? "demo_" : "";
  const K = { dev: P + "lspd_dev", sess: P + "lspd_sess", prof: P + "lspd_prof" };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} },
    json(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  };
  const sess = {
    get(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) {} }
  };
  const params = new URLSearchParams(location.search);

  // ---------- sound (made in code with Web Audio: no files to load) ----------
  const SFX = (function () {
    // Realistic hardware sounds, all made in code (no files): fan spin-up, mains hum, drive seeks,
    // relay clicks, packet hiss, key clicks. No musical tones except one soft PC-speaker beep.
    let ctx = null, on = store.get("lspd_sound") !== "off", nbuf = null, amb = null;
    function ac() {
      if (!on) return null;
      try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) { return null; }
      return ctx;
    }
    function noiseBuf(c) { if (nbuf) return nbuf; const n = c.sampleRate * 2; nbuf = c.createBuffer(1, n, c.sampleRate); const d = nbuf.getChannelData(0); let b = 0; for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; d[i] = w * 0.5 + b * 3; } return nbuf; }
    // a filtered noise burst: the building block for clicks, seeks and hiss
    function burst(dur, vol, freq, type, at, q) {
      const c = ac(); if (!c) return; const t = c.currentTime + (at || 0);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noiseBuf(c); f.type = type || "bandpass"; f.frequency.value = freq || 2000; f.Q.value = q || 1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(c.destination); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
    }
    function beep(f, dur, vol, at) {                   // plain sine, soft attack: PC speaker / system confirm
      const c = ac(); if (!c) return; const t = c.currentTime + (at || 0);
      const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    const click = (at, v) => { burst(0.012, v || 0.09, 3800, "highpass", at, 0.7); burst(0.03, (v || 0.09) * 0.5, 900, "bandpass", at, 2); };   // relay / switch
    const seek = (at, v) => { burst(0.018, v || 0.05, 2600, "bandpass", at, 3); burst(0.012, (v || 0.05) * 0.7, 1400, "bandpass", (at || 0) + 0.03 + Math.random() * 0.03, 4); };   // hard-drive head
    function sq(f, dur, vol, at) {                     // PC speaker: a raw square wave
      const c = ac(); if (!c) return; const t = c.currentTime + (at || 0);
      const o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur - 0.005); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.01);
    }
    function press() {                                 // chunky tower power button: push… release
      burst(0.07, 0.22, 260, "lowpass", 0, 0.8); burst(0.012, 0.12, 3200, "highpass", 0, 0.7);
      burst(0.01, 0.07, 3600, "highpass", 0.11, 0.7); burst(0.04, 0.08, 500, "lowpass", 0.11, 1);
    }
    function degauss(at) {                             // CRT monitor coming on: THUNK + decaying hum
      const c = ac(); if (!c) return; const t = c.currentTime + (at || 0);
      burst(0.18, 0.2, 140, "lowpass", at, 1);
      [60, 120, 180].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime([0.12, 0.05, 0.025][i], t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.95); });
    }
    function floppy(at) {                              // floppy drive: stepper motor brrt-brrt + head clacks
      at = at || 0;
      for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) { const tt = at + r * 0.26 + i * 0.03; sq(r === 1 ? 92 : 70, 0.018, 0.022, tt); burst(0.008, 0.04, 2200, "bandpass", tt, 2); }
      burst(0.02, 0.07, 1500, "bandpass", at + 0.82, 3);
    }
    function dialup(at) {                              // modem: dial the relay, answer tone, handshake
      at = at || 0; const c = ac(); if (!c) return;
      const D = { 5: [770, 1336], 1: [697, 1209], 8: [852, 1336], 0: [941, 1336], 4: [770, 1209], 2: [697, 1336], 9: [852, 1477] };
      "5550142".split("").forEach((d, i) => D[d].forEach(f => beep(f, 0.075, 0.02, at + i * 0.11)));
      const a2 = at + 0.95; beep(2100, 0.38, 0.022, a2);
      for (let i = 0; i < 6; i++) { beep(i % 2 ? 2400 : 1200, 0.07, 0.014, a2 + 0.42 + i * 0.08); burst(0.07, 0.02, 1800, "bandpass", a2 + 0.42 + i * 0.08, 0.8); }
      burst(0.45, 0.03, 2000, "bandpass", a2 + 0.92, 0.6);
    }
    function ambient() {                               // case fan spinning up + faint mains hum, held under the boot
      const c = ac(); if (!c || amb) return; const t = c.currentTime;
      const s = c.createBufferSource(), lp = c.createBiquadFilter(), g = c.createGain(), hum = c.createOscillator(), hum2 = c.createOscillator(), hg = c.createGain();
      s.buffer = noiseBuf(c); s.loop = true; lp.type = "lowpass"; lp.Q.value = 0.6;
      lp.frequency.setValueAtTime(120, t); lp.frequency.exponentialRampToValueAtTime(1300, t + 1.4); lp.frequency.exponentialRampToValueAtTime(650, t + 2.6);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.11, t + 1.2); g.gain.exponentialRampToValueAtTime(0.045, t + 2.8);
      hum.frequency.value = 60; hum2.frequency.value = 120; hg.gain.setValueAtTime(0.0001, t); hg.gain.exponentialRampToValueAtTime(0.02, t + 0.4);
      s.connect(lp).connect(g).connect(c.destination); hum.connect(hg); hum2.connect(hg); hg.connect(c.destination);
      const sp = c.createOscillator(), sg = c.createGain(); sp.type = "triangle";
      sp.frequency.setValueAtTime(70, t); sp.frequency.exponentialRampToValueAtTime(390, t + 3);    // hard drive platters spinning up
      sg.gain.setValueAtTime(0.0001, t); sg.gain.exponentialRampToValueAtTime(0.014, t + 0.6); sg.gain.exponentialRampToValueAtTime(0.006, t + 4);
      sp.connect(sg).connect(c.destination);
      s.start(t); hum.start(t); hum2.start(t); sp.start(t); amb = { s, g, hg, hum, hum2, sp, sg };
    }
    function settle() {                                // fan winds down to idle, hum fades
      const c = ctx; if (!c || !amb) return; const t = c.currentTime, a = amb; amb = null;
      a.g.gain.cancelScheduledValues(t); a.g.gain.setValueAtTime(a.g.gain.value || 0.04, t); a.g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      a.hg.gain.cancelScheduledValues(t); a.hg.gain.setValueAtTime(a.hg.gain.value || 0.02, t); a.hg.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      a.sg.gain.cancelScheduledValues(t); a.sg.gain.setValueAtTime(a.sg.gain.value || 0.006, t); a.sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4); a.sp.frequency.cancelScheduledValues(t); a.sp.frequency.setValueAtTime(a.sp.frequency.value || 390, t); a.sp.frequency.exponentialRampToValueAtTime(180, t + 1.5);
      [a.s, a.hum, a.hum2, a.sp].forEach(n => n.stop(t + 1.7));
    }
    return {
      unlock() { ac(); },
      ctx() { return ac(); },
      get on() { return on; },
      toggle() { on = !on; store.set("lspd_sound", on ? "" : "off"); if (!on) settle(); else this.key(); return on; },
      settle: settle,
      power() { press(); degauss(0.13); setTimeout(ambient, 120); for (let i = 0; i < 6; i++) seek(0.6 + i * 0.12 + Math.random() * 0.05); },
      post() { sq(1000, 0.14, 0.03); },
      floppy() { floppy(0); },
      dialup() { dialup(0); },
      tick() { seek(0, 0.035); },
      ok() { },                                        // quiet: the drive/relay sounds carry the boot
      warn() { },
      data() { burst(0.05 + Math.random() * 0.05, 0.03, 2500 + Math.random() * 2000, "bandpass", 0, 1.5); if (Math.random() < 0.4) seek(0.02, 0.03); },
      whir() { for (let i = 0; i < 4; i++) seek(i * 0.07 + Math.random() * 0.03, 0.045); },
      cipher() { burst(0.03, 0.02, 4500 + Math.random() * 2500, "bandpass", 0, 2); },
      lock() { click(0, 0.1); click(0.07, 0.07); },
      sweep(dur) { const n = Math.max(4, Math.floor((dur || 1) / 0.09)); for (let i = 0; i < n; i++) burst(0.06, 0.035 * (1 - i / n * 0.6), 1800 + Math.random() * 2200, "bandpass", i * 0.09 + Math.random() * 0.03, 1.2); },
      secure() { click(0, 0.08); beep(880, 0.11, 0.025, 0.08); },
      key() { burst(0.01, 0.12, 3000, "highpass", 0, 0.7); burst(0.035, 0.06, 450, "lowpass", 0.004, 1); },
      bad() { beep(330, 0.22, 0.04); click(0, 0.06); },
      good() { click(0, 0.09); beep(1000, 0.09, 0.025, 0.06); },
      squelch() { click(0, 0.1); burst(0.16, 0.035, 2200, "bandpass", 0.03, 0.8); }
    };
  })();
  (function () {
    const b = $("snd"); const paint = () => { b.textContent = SFX.on ? "🔊" : "🔇"; b.classList.toggle("off", !SFX.on); };
    paint(); b.onclick = () => { SFX.toggle(); paint(); };
    const first = () => { SFX.unlock(); document.removeEventListener("pointerdown", first, true); document.removeEventListener("keydown", first, true); };
    document.addEventListener("pointerdown", first, true); document.addEventListener("keydown", first, true);
  })();

  // where to go after signing on: only pages on this site
  function safeNext(v) { v = String(v || ""); return /^[A-Za-z0-9_\-\/]+(\.html)?([?#][^\s]*)?$/.test(v) && !/^\/\//.test(v) ? v : ""; }
  if (safeNext(params.get("next"))) sess.set("lspd_next", safeNext(params.get("next")));
  const NEXT = () => sess.get("lspd_next") || "index.html";

  // ---------- backend ----------
  async function api(body) {
    if (DEMO) return demoApi(body);
    try { return await Portal.post(body); }
    catch (e) { return { ok: false, error: "Couldn't reach the LSPD server. Check your connection and try again.", net: true }; }
  }
  function demoApi(b) {

      const c = SFX.ctx(); if (!c || !pending) return false;
      const plan = await Promise.race([pending, new Promise(r => setTimeout(() => r(null), 2500))]); if (!plan) return false;
      const parts = [plan.greet[when], plan.name, plan.close].map(k => { try { return localStorage.getItem(LS + k); } catch (e) { return null; } });
      if (parts.some(x => !x)) return false;
      try {
        const bufs = (await Promise.all(parts.map(b => decode(c, b)))).map(b => trim(c, b));
        const g = c.createGain(); g.gain.value = 1; g.connect(c.destination);
        let t = c.currentTime + 0.08; const gaps = [0.16, 0.24, 0];   // comma pause after the greeting, full stop after the name
        bufs.forEach((b, i) => { const src = c.createBufferSource(); src.buffer = b; src.connect(g); src.start(t); t += b.duration + gaps[i]; });
        await new Promise(r => setTimeout(r, (t - c.currentTime) * 1000 + 150));
        return true;
      } catch (e) { return false; }
    }
    return { prefetch, play };
  })();
  const whenNow = () => { const h = new Date().getHours(); return h < 5 ? "evening" : h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"; };

  async function finish(r) {
    activePad = null;
    store.set(K.sess, r.session || ""); if (r.profile) store.set(K.prof, JSON.stringify(r.profile));
    const p = r.profile || store.json(K.prof) || {};
    const l = line("Signing on " + esc((p.callsign ? p.callsign + " · " : "") + addr(p).toUpperCase()) + " ...."); progress(100);
    await new Promise(res => setTimeout(res, 350)); l.done("10-8");
    show('<div class="ok-big"><i>✓</i><div><h2>' + esc(greet()) + ", " + esc(addr(p)) + '.</h2><p class="sub" style="margin:2px 0 0">Signed on' + (p.callsign ? " as <b>" + esc(p.callsign) + "</b>" : "") + ". Opening the terminal…</p></div></div>");
    const to = NEXT(); sess.set("lspd_next", "");
    const spoken = EVoice.play(whenNow()).then(done => done ? null : Voice.say(greet() + ", " + addr(p) + ". You're signed on."));
    await Promise.all([spoken, new Promise(res => setTimeout(res, 1300))]);
    setTimeout(() => { if (DEMO) { show('<div class="ok-big"><i>✓</i><div><h2>Demo complete</h2><p class="sub" style="margin:2px 0 0">On the live site this now opens the portal. <a href="?demo=1" style="color:var(--blue)">Run the demo again</a> (your demo PIN is remembered until you close the tab).</p></div></div>'); return; } location.replace(to); }, 250);
  }

  function screenError(msg) {
    progress(100);
    show('<h2>Can\'t reach the terminal</h2><p class="sub">' + esc(msg) + '</p><button class="btn" type="button" id="retry">Try again</button>');
    $("retry").onclick = () => location.reload();
  }

  // ---------- flow ----------
  async function run() {
    if (params.get("out") === "1") { store.set(K.sess, ""); }       // sign out on this device (keeps the device, so next time is just the PIN)
    const intro = bootIntro();
    const code = params.get("code"), state = params.get("state"), err = params.get("error");
    if (code || err) history.replaceState(null, "", location.pathname + (DEMO ? "?demo=1" : ""));

    if (err) { await intro; line("Discord sign-in cancelled").done("ABORT", "w"); return screenDiscord("Discord sign-in was cancelled. Try again when you're ready.", true); }

    if (code) {
      await intro;
      const l = line("Confirming Discord identity ................");
      const r = await api({ action: "acctDiscord", code: code, state: state });
      if (!r.ok) { l.done("DENIED", "x"); return r.net ? screenError(r.error) : screenDiscord(r.error); }
      l.done("OK"); progress(70);
      store.set(K.dev, r.device); if (r.profile) store.set(K.prof, JSON.stringify(r.profile));
      const l2 = line("Matching LSPD roster ......................."); await sleep(300); l2.done(r.profile && r.profile.callsign ? r.profile.callsign : "OK"); progress(90);
      return r.hasPin ? screenPin(r.profile) : screenCreate(r.profile);
    }

    const session = store.get(K.sess), device = store.get(K.dev), profile = store.json(K.prof);
    if (session) {
      await intro;
      const l = line("Restoring session ..........................");
      const r = await api({ action: "acctMe", session: session });
      if (r.ok) { l.done("OK"); EVoice.prefetch(device); return finish({ session: session, profile: r.profile }); }
      if (r.net) { l.done("OFFLINE", "x"); return screenError(r.error); }
      l.done("EXPIRED", "w"); store.set(K.sess, "");
    }
    await intro;
    if (device) { const l = line("Device recognised, PIN required ............"); await sleep(250); l.done("LOCKED", "w"); return screenPin(profile); }
    const l = line("Unknown device, identity check required ....."); await sleep(250); l.done("STANDBY", "w");
    screenDiscord();
  }

  if (DEMO) document.body.classList.add("is-demo");
  if (DEMO) document.body.insertAdjacentHTML("afterbegin", '<div class="demo">DEMO MODE · NOTHING IS SAVED · TRY ANY PIN, THEN SIGN ON WITH IT</div>');
  run().then(() => { $("skip").hidden = true; }).catch(e => screenError(e && e.message ? e.message : "Something went wrong."));
})();
</script>
</body>
