<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&family=Black+Ops+One&family=Rajdhani:wght@600;700&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=202610200937">
</head>
<body>
<div class="lightbar"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" onclick="go('home')">
      <img class="brand-logo" id="brandLogo" src="img/lspd-patch.png" alt="LSPD">
      <div><b id="brandName">LSPD</b><small id="brandSub">LOS SANTOS POLICE DEPT.</small></div>
    </a>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span> Records Portal</div>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="hero">
      <img class="hero-logo" id="heroLogo" src="img/lspd-patch.png" alt="">
      <span class="tag" id="heroTag">OFFICIAL FORMS PORTAL</span>
      <h1 id="heroName">LSPD</h1>
      <p id="heroText">Select a form below to file an official record to Discord.</p>
    </div>
    <div class="maint" id="maint" style="display:none"></div>
    <div class="announce" id="announce" style="display:none"></div>
    <div class="stale" id="stale" style="display:none"></div>
    <div id="formGrid"><div class="loading">Loading forms…</div></div>
    <div id="programs"></div>
  </section>

  <!-- SGT PROMOTION TRACKER -->
  <section class="view" id="view-promo">
    <div class="crumbs"><a onclick="go('home')">← All Forms</a> &nbsp;/&nbsp; Training Progression &nbsp;/&nbsp; <span id="promoCrumb">CPL → SGT</span></div>
    <div id="promoMount"><div class="loading">Loading tracker…</div></div>
  </section>

  <!-- ANY FORM -->
  <section class="view" id="view-form">
    <div class="crumbs"><a onclick="go('home')">← All Forms</a> &nbsp;/&nbsp; <span id="formCrumb"></span></div>
    <div class="maint" id="formMaint" style="display:none"></div>
    <form id="theForm" novalidate autocomplete="off">
      <div id="formMount"></div>
      <div class="actions">
        <span id="draftStatus" class="draftstat"></span>
        <button type="button" class="btn ghost" id="copyBtn" style="display:none">Copy as Text</button>
        <button type="button" class="btn ghost" id="clearBtn">Clear Form</button>
        <button type="submit" class="btn primary" id="submitBtn">Submit</button>
      </div>
    </form>
  </section>
  <footer id="footer">LOS SANTOS POLICE DEPARTMENT · INTERNAL USE ONLY</footer>
</main>

<div class="toast" id="toast"></div>

<script src="forms.js?v=202610200937"></script>
<script>
const $ = id => document.getElementById(id);
const CFG_KEY = "lspd_portal_cfg";
let CONFIG = null, current = null, ctrl = null;

function toast(msg, type){
  const t = $("toast"); t.textContent = msg; t.className = "toast show " + (type||"");
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className="toast", 4800);
}
function draftStatus(msg){ const el = $("draftStatus"); el.textContent = msg; el.classList.toggle("on", !!msg); }

/* ---------- routing ---------- */
function go(view){
  if(view === "promo" && !(CONFIG && promoOn())) view = "home";
  if(view !== "home" && view !== "promo" && !openForm(view)) view = "home";
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(view === "home" ? "view-home" : view === "promo" ? "view-promo" : "view-form").classList.add("active");
  if(view === "promo") loadPromo();
  if(view === "home"){ if(ctrl) ctrl.saveDraft(); current = null; }
  history.replaceState(null, "", view === "home" ? location.pathname : "#" + view);
  window.scrollTo({top:0,behavior:"smooth"});
}
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if(h && h !== (current && current.id)) go(h); });

/* ---------- home ---------- */
function renderHome(){
  const s = CONFIG.settings || {};
  document.title = s.portalName || "LSPD";
  $("brandName").textContent = $("heroName").textContent = s.portalName || "LSPD";
  $("brandSub").textContent = s.portalSub || "";
  $("heroTag").textContent = s.heroTag || "";
  $("heroTag").style.display = s.heroTag ? "" : "none";
  $("heroText").textContent = s.heroText || "";
  const logo = s.heroLogo == null ? "img/lspd-patch.png" : s.heroLogo;
  $("heroLogo").style.display = logo ? "" : "none";
  if (logo && $("heroLogo").getAttribute("src") !== logo) $("heroLogo").src = logo;
  const brand = logo || "img/lspd-patch.png";   // header icon follows the home page logo
  if ($("brandLogo").getAttribute("src") !== brand) $("brandLogo").src = brand;
  $("footer").textContent = s.footer || "";
  const ann = s.announcement || {};
  $("announce").style.display = ann.text ? "" : "none";
  $("announce").className = "announce " + (ann.style || "info");
  $("announce").textContent = ann.text || "";
  const m = s.maintenance || {};
  ["maint","formMaint"].forEach(id => { $(id).style.display = m.on ? "" : "none"; $(id).textContent = "🛠️ " + (m.message || "Maintenance in progress."); });

  const forms = (CONFIG.forms || []).filter(f => f.status === "live" || f.status === "soon");
  // forms are grouped by their "Home page section" (set in the admin builder); order follows the form list
  const groups = [];
  forms.forEach(f => {
    const name = String(f.section || "").trim() || "Reports";
    let g = groups.find(x => x.name.toLowerCase() === name.toLowerCase());
    if(!g) groups.push(g = { name: name, forms: [] });
    g.forms.push(f);
  });
  const card = f => {
    const live = f.status === "live";
    return `<div class="card ${live?"":"soon"}" ${live?`data-open="${Portal.esc(f.id)}"`:""}>
      <div class="ico">${Portal.esc(f.icon||"📄")}</div>
      <h3>${Portal.esc(f.title)}</h3><p>${Portal.esc(f.description||"")}</p>
      <div class="go">${live?"OPEN FORM →":"COMING SOON"}</div></div>`;
  };
  const icon = n => /train|academy|fto|school|course/i.test(n) ? "🎓" : /report|record/i.test(n) ? "📁" : /division|unit/i.test(n) ? "🛡️" : "📋";
  $("formGrid").innerHTML = forms.length ? groups.map(g => `<section class="fsec ${/train|academy|fto/i.test(g.name) ? "training" : ""}">
      ${groups.length > 1 ? `<div class="fsec-head"><span class="fsec-ico">${icon(g.name)}</span><h2>${Portal.esc(g.name)}</h2><span class="fsec-n">${g.forms.length}</span></div>` : ""}
      <div class="grid">${g.forms.map(card).join("")}</div></section>`).join("") : '<div class="loading">No forms are published yet.</div>';
  renderPrograms();
}

/* ---------- SGT promotion tracker ---------- */
function promoOn(){ const p = (CONFIG.settings || {}).promo; return !!(p && p.on !== false); }
let PROMO = null, PROMO_T = 0, promoFilter = "all", promoQuery = "";
function renderPrograms(){
  const p = (CONFIG.settings || {}).promo, on = promoOn();
  if(!on){ $("programs").innerHTML = ""; return; }
  const st = PROMO && PROMO.candidates ? PROMO.candidates : null;
  const ready = st ? st.filter(c => c.complete).length : 0;
  const tiles = [{ go: "promo", title: p.title || "CPL → SGT", sub: st ? st.length + " corporal" + (st.length === 1 ? "" : "s") + " · " + ready + " ready" : "View progress" }];   // more programs can be added here later
  $("programs").innerHTML = `<section class="fsec progsec"><div class="fsec-head"><span class="fsec-ico">📈</span><h2>Training Progression</h2></div>
    <div class="prog-tiles">${tiles.map(t => `<a class="prog-tile" onclick="go('${t.go}')"><span class="pt-ico">🎖️</span><span class="pt-txt"><b>${Portal.esc(t.title)}</b><small>${Portal.esc(t.sub)}</small></span><span class="pt-go">→</span></a>`).join("")}</div></section>`;
  if(!st && Date.now() - PROMO_T > 30000) fetchPromo().then(renderPrograms).catch(()=>{});
}
async function fetchPromo(){
  PROMO_T = Date.now();
  const res = await fetch(Portal.ENDPOINT + "?action=promo&t=" + Date.now());
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Could not load the tracker");
  PROMO = data.promo; return PROMO;
}
function ring(done, total, size){
  const r = 26, c = 2 * Math.PI * r, f = total ? done / total : 0;
  return `<svg class="ring" viewBox="0 0 64 64" width="${size||64}" height="${size||64}"><circle cx="32" cy="32" r="${r}" class="rb"/><circle cx="32" cy="32" r="${r}" class="rf" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="36">${done}/${total}</text></svg>`;
}
function loadPromo(){
  const p = (CONFIG.settings || {}).promo || {};
  $("promoCrumb").textContent = p.title || "CPL → SGT";
  if(PROMO && PROMO.candidates) drawPromo();
  fetchPromo().then(drawPromo).catch(e => { if(!PROMO) $("promoMount").innerHTML = '<div class="loading">Could not load the tracker. ' + Portal.esc(e.message) + '</div>'; });
}
let promoOpen = new Set();
function drawPromo(){
  const P = PROMO, E = Portal.esc;
  if(!P.on){ $("promoMount").innerHTML = '<div class="loading">The tracker is turned off.</div>'; return; }
  const T = P.tasks || [];
  const C = (P.candidates || []).slice().sort((a,b) => (b.complete - a.complete) || (b.done - a.done) || a.callsign.localeCompare(b.callsign, undefined, {numeric:true}));
  const ready = C.filter(c => c.complete).length;
  const avg = C.length ? Math.round(C.reduce((n,c) => n + c.done / Math.max(1,c.total), 0) / C.length * 100) : 0;
  const q = promoQuery.toLowerCase();
  const shown = C.filter(c => (promoFilter === "all" || (promoFilter === "ready" ? c.complete : !c.complete)) && (!q || (c.callsign + " " + c.name).toLowerCase().includes(q)));
  const fmtD = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
  const short = t => t.title.replace(/Global Operation Manual/i, "GOM").replace(/^(Witness|Lead|Complete|Do)\s+(a|an)?\s*/i, m => m.split(" ")[0] + " ");
  const cell = (c, t) => {
    const s = c.tasks[t.id] || {count:0, need:t.need};
    if (s.excused) return `<span class="pb-c ex" title="Excused">EX</span>`;
    if (s.done) return `<span class="pb-c ok" title="Done">✓</span>`;
    if (s.locked) return `<span class="pb-c lk" title="Locked until the other requirements and time in grade are done"><svg viewBox="0 0 16 16"><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="7" width="9" height="7" rx="1.5" fill="currentColor"/></svg></span>`;
    if (!s.count) return `<span class="pb-c zero" title="Not started">·</span>`;
    return `<span class="pb-c part" title="${s.count} of ${s.need}"><i style="--p:${Math.round(s.count / s.need * 100)}%"></i>${s.count}/${s.need}</span>`;
  };
  const detail = c => `<div class="pb-detail">${T.map((t, i) => {
    const s = c.tasks[t.id] || {count:0, need:t.need, items:[]};
    const st = s.excused ? "Excused" : s.done ? "Complete" : s.locked ? "Locked" : s.count + " of " + s.need;
    return `<div class="pd-item ${s.done ? "ok" : ""}"><div class="pd-h"><span class="pd-n">${i + 1}</span><b>${E(t.title)}</b><em>${st}</em></div>
      ${s.items.length ? `<ul>${s.items.map(x => `<li>${E(fmtD(x.date))} · ${E(x.source)}${x.report ? ` <code>${E(x.report)}</code>` : ""}${x.count > 1 ? " ×" + x.count : ""}</li>`).join("")}</ul>`
        : `<p>${s.locked && !s.done ? "Unlocks after every other requirement" + (P.tigDays ? " and " + P.tigDays + " days TIG" : "") + "." : "Nothing logged yet."}</p>`}</div>`;
  }).join("")}</div>`;
  const tigTxt = c => c.tig == null ? "TIG —" : "TIG " + c.tig + "d";
  $("promoMount").innerHTML = `
    <header class="pb-head">
      <div class="pb-title">
        <div class="pb-rank" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M8 14l12-7 12 7M8 21l12-7 12 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 28l12-7 12 7" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 5" opacity=".9"/></svg></div>
        <div><span class="pb-kick">Training Progression</span><h1>${E(P.title)}</h1>${P.subtitle ? `<p>${E(P.subtitle)}</p>` : ""}</div>
      </div>
      <dl class="pb-stats"><div><dt>Corporals</dt><dd>${C.length}</dd></div><div><dt>Ready</dt><dd class="g">${ready}</dd></div><div><dt>Average</dt><dd>${avg}%</dd></div></dl>
    </header>
    <div class="pb-tools"><input id="promoQ" placeholder="Search callsign or name" value="${E(promoQuery)}">
      <div class="seg">${[["all","All"],["prog","In progress"],["ready","Ready"]].map(([k,l]) => `<button data-pf="${k}" class="${promoFilter===k?"on":""}">${l}</button>`).join("")}</div></div>
    ${P.error ? `<div class="maint">${E(P.error)}</div>` : ""}
    <div class="pb-board" style="--cols:${T.length}">
      <div class="pb-row pb-th"><span class="pb-who">Corporal</span>${T.map((t, i) => `<span class="pb-task" title="${E(t.title)} (×${t.need})"><b>${i + 1}</b><small>${E(short(t))}</small></span>`).join("")}<span class="pb-prog">Progress</span></div>
      ${shown.length ? shown.map(c => {
        const k = c.callsign, open = promoOpen.has(k);
        return `<div class="pb-item ${c.complete ? "ready" : ""} ${open ? "open" : ""}">
          <button class="pb-row" data-row="${E(k)}" aria-expanded="${open}">
            <span class="pb-who"><code>${E(c.callsign)}</code><span class="nm">${E(c.name)}</span><span class="tg ${c.tigOk ? "ok" : ""}">${tigTxt(c)}</span></span>
            ${T.map((t, i) => `<span class="pb-cell" data-n="${i + 1}">${cell(c, t)}</span>`).join("")}
            <span class="pb-prog">${c.complete ? '<span class="rd">Ready</span>' : ""}<span class="bar"><i style="width:${Math.round(c.done / Math.max(1,c.total) * 100)}%"></i></span><b>${c.done}/${c.total}</b></span>
          </button>${open ? detail(c) : ""}</div>`;
      }).join("") : `<div class="pb-empty">${C.length ? "No one matches." : "No corporals found on the roster."}</div>`}
    </div>
    <ol class="pb-legend">${T.map(t => `<li><span>${E(t.title)}</span><b>×${t.need}</b>${t.final ? "<em>final</em>" : ""}</li>`).join("")}</ol>
    <p class="promo-upd">${P.tigDays ? `Final step requires ${P.tigDays} days time in grade. ` : ""}Updates when a report is filed · checked ${new Date(P.updated || Date.now()).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</p>`;
  const qi = $("promoQ"); qi.oninput = () => { promoQuery = qi.value; const pos = qi.selectionStart; drawPromo(); const n = $("promoQ"); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { promoFilter = b.dataset.pf; drawPromo(); });
  document.querySelectorAll("[data-row]").forEach(b => b.onclick = () => { const k = b.dataset.row; promoOpen.has(k) ? promoOpen.delete(k) : promoOpen.add(k); drawPromo(); });
}
$("formGrid").addEventListener("click", e => { const c = e.target.closest("[data-open]"); if(c) go(c.dataset.open); });

/* ---------- form ---------- */
function openForm(id){
  const f = CONFIG && (CONFIG.forms || []).find(x => x.id === id && x.status === "live");
  if(!f) return false;
  if(current && current.id === id && JSON.stringify(current) === JSON.stringify(f)) return true;
  if(ctrl) ctrl.saveDraft();
  current = f;
  $("formCrumb").textContent = f.title;
  $("submitBtn").textContent = f.submitLabel || "Submit to Discord";
  $("copyBtn").style.display = f.copyText ? "" : "none";
  draftStatus("");
  ctrl = Portal.render(f, $("formMount"), { draft: true, onStatus: draftStatus });
  const t = ctrl.restoreDraft();
  if(t) toast("Restored your unsaved draft from " + new Date(t).toLocaleString(), "ok");
  return true;
}

$("clearBtn").onclick = ()=>{ if(confirm("Clear everything on this form?")) ctrl.clear(); };
$("copyBtn").onclick = async ()=>{
  const text = ctrl.toText();
  try{ await navigator.clipboard.writeText(text); toast("Copied as plain text.","ok"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied as plain text.","ok"); }catch(_){ toast("Copy blocked by the browser.","bad"); }
    ta.remove();
  }
};
$("theForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const problem = ctrl.validate();
  if(problem){ toast("Missing Info: " + problem, "bad"); return; }
  const btn = $("submitBtn"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending…";
  try{
    const data = await Portal.post(ctrl.collect());
    if(data.ok){
      toast(data.warning ? "Posted, with a warning: " + data.warning : "Success: " + current.title + " posted to Discord!", data.warning ? "bad" : "ok");
      ctrl.clear();
    } else toast("Error: " + (data.error || "Unknown error"), "bad");
  }catch(err){
    toast("Failed to send: " + err.message, "bad");
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
});
window.addEventListener("beforeunload", ()=>{ if(ctrl && current) ctrl.saveDraft(); });

/* ---------- boot: show cached forms instantly, then refresh from Google ---------- */
function apply(cfg){
  CONFIG = cfg;
  if (Portal.setRoster) Portal.setRoster(cfg.roster || []);
  if (Portal.setRosters) Portal.setRosters(cfg.rosters || {});
  renderHome();
  const h = location.hash.slice(1);
  if(h) go(h);
  else if(current) openForm(current.id);
}
try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if(c) apply(c); }catch(e){}
Portal.loadConfig().then(cfg => {
  const changed = !CONFIG || CONFIG.version !== cfg.version;
  const rosterChanged = !CONFIG || JSON.stringify([CONFIG.roster || [], CONFIG.rosters || {}]) !== JSON.stringify([cfg.roster || [], cfg.rosters || {}]);
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  if(changed) apply(cfg);
  else if(rosterChanged){ CONFIG = cfg; if (Portal.setRoster) Portal.setRoster(cfg.roster || []); if (Portal.setRosters) Portal.setRosters(cfg.rosters || {}); }   // fresh roster, no form reload needed
  $("stale").style.display = "none";
}).catch(err => {
  if(CONFIG){ $("stale").style.display = ""; $("stale").innerHTML = "⚠️ Couldn't get the latest forms from the server, so this is the last saved copy. <a onclick=\"location.reload()\">Try again</a><small>" + Portal.esc(err.message) + "</small>"; }
  if(!CONFIG) $("formGrid").innerHTML = '<div class="loading">Could not load forms. Check your connection and refresh.<br><small>' + Portal.esc(err.message) + '</small></div>';
});
</script>
</body>
</html>
