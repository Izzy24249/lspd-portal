<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=202610200937">
</head>
<body>
<div class="lightbar"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" onclick="go('home')">
      <img class="brand-logo" id="brandLogo" src="img/lspd-patch.png" alt="LSPD">
      <div><b id="brandName">LSPD</b><small id="brandSub">LOS SANTOS POLICE DEPT.</small></div>
    </a>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span> Records Portal</div>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="hero">
      <img class="hero-logo" id="heroLogo" src="img/lspd-patch.png" alt="">
      <span class="tag" id="heroTag">OFFICIAL FORMS PORTAL</span>
      <h1 id="heroName">LSPD</h1>
      <p id="heroText">Select a form below to file an official record to Discord.</p>
    </div>
    <div class="maint" id="maint" style="display:none"></div>
    <div class="announce" id="announce" style="display:none"></div>
    <div class="grid" id="formGrid"><div class="loading">Loading forms…</div></div>
  </section>

  <!-- ANY FORM -->
  <section class="view" id="view-form">
    <div class="crumbs"><a onclick="go('home')">← All Forms</a> &nbsp;/&nbsp; <span id="formCrumb"></span></div>
    <div class="maint" id="formMaint" style="display:none"></div>
    <form id="theForm" novalidate autocomplete="off">
      <div id="formMount"></div>
      <div class="actions">
        <span id="draftStatus" class="draftstat"></span>
        <button type="button" class="btn ghost" id="copyBtn" style="display:none">Copy as Text</button>
        <button type="button" class="btn ghost" id="clearBtn">Clear Form</button>
        <button type="submit" class="btn primary" id="submitBtn">Submit</button>
      </div>
    </form>
  </section>
  <footer id="footer">LOS SANTOS POLICE DEPARTMENT · INTERNAL USE ONLY</footer>
</main>

<div class="toast" id="toast"></div>

<script src="forms.js?v=202610200937"></script>
<script>
const $ = id => document.getElementById(id);
const CFG_KEY = "lspd_portal_cfg";
let CONFIG = null, current = null, ctrl = null;

function toast(msg, type){
  const t = $("toast"); t.textContent = msg; t.className = "toast show " + (type||"");
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className="toast", 4800);
}
function draftStatus(msg){ const el = $("draftStatus"); el.textContent = msg; el.classList.toggle("on", !!msg); }

/* ---------- routing ---------- */
function go(view){
  if(view !== "home" && !openForm(view)) view = "home";
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(view === "home" ? "view-home" : "view-form").classList.add("active");
  if(view === "home"){ if(ctrl) ctrl.saveDraft(); current = null; }
  history.replaceState(null, "", view === "home" ? location.pathname : "#" + view);
  window.scrollTo({top:0,behavior:"smooth"});
}
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if(h && h !== (current && current.id)) go(h); });

/* ---------- home ---------- */
function renderHome(){
  const s = CONFIG.settings || {};
  document.title = s.portalName || "LSPD";
  $("brandName").textContent = $("heroName").textContent = s.portalName || "LSPD";
  $("brandSub").textContent = s.portalSub || "";
  $("heroTag").textContent = s.heroTag || "";
  $("heroTag").style.display = s.heroTag ? "" : "none";
  $("heroText").textContent = s.heroText || "";
  const logo = s.heroLogo == null ? "img/lspd-patch.png" : s.heroLogo;
  $("heroLogo").style.display = logo ? "" : "none";
  if (logo && $("heroLogo").getAttribute("src") !== logo) $("heroLogo").src = logo;
  const brand = logo || "img/lspd-patch.png";   // header icon follows the home page logo
  if ($("brandLogo").getAttribute("src") !== brand) $("brandLogo").src = brand;
  $("footer").textContent = s.footer || "";
  const ann = s.announcement || {};
  $("announce").style.display = ann.text ? "" : "none";
  $("announce").className = "announce " + (ann.style || "info");
  $("announce").textContent = ann.text || "";
  const m = s.maintenance || {};
  ["maint","formMaint"].forEach(id => { $(id).style.display = m.on ? "" : "none"; $(id).textContent = "🛠️ " + (m.message || "Maintenance in progress."); });

  const forms = (CONFIG.forms || []).filter(f => f.status === "live" || f.status === "soon");
  $("formGrid").innerHTML = forms.length ? forms.map(f => {
    const live = f.status === "live";
    return `<div class="card ${live?"":"soon"}" ${live?`data-open="${Portal.esc(f.id)}"`:""}>
      <div class="ico">${Portal.esc(f.icon||"📄")}</div>
      <h3>${Portal.esc(f.title)}</h3><p>${Portal.esc(f.description||"")}</p>
      <div class="go">${live?"OPEN FORM →":"COMING SOON"}</div></div>`;
  }).join("") : '<div class="loading">No forms are published yet.</div>';
}
$("formGrid").addEventListener("click", e => { const c = e.target.closest("[data-open]"); if(c) go(c.dataset.open); });

/* ---------- form ---------- */
function openForm(id){
  const f = CONFIG && (CONFIG.forms || []).find(x => x.id === id && x.status === "live");
  if(!f) return false;
  if(current && current.id === id && JSON.stringify(current) === JSON.stringify(f)) return true;
  if(ctrl) ctrl.saveDraft();
  current = f;
  $("formCrumb").textContent = f.title;
  $("submitBtn").textContent = f.submitLabel || "Submit to Discord";
  $("copyBtn").style.display = f.copyText ? "" : "none";
  draftStatus("");
  ctrl = Portal.render(f, $("formMount"), { draft: true, onStatus: draftStatus });
  const t = ctrl.restoreDraft();
  if(t) toast("Restored your unsaved draft from " + new Date(t).toLocaleString(), "ok");
  return true;
}

$("clearBtn").onclick = ()=>{ if(confirm("Clear everything on this form?")) ctrl.clear(); };
$("copyBtn").onclick = async ()=>{
  const text = ctrl.toText();
  try{ await navigator.clipboard.writeText(text); toast("Copied as plain text.","ok"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied as plain text.","ok"); }catch(_){ toast("Copy blocked by the browser.","bad"); }
    ta.remove();
  }
};
$("theForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const problem = ctrl.validate();
  if(problem){ toast("Missing Info: " + problem, "bad"); return; }
  const btn = $("submitBtn"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending…";
  try{
    const data = await Portal.post(ctrl.collect());
    if(data.ok){
      toast(data.warning ? "Posted, with a warning: " + data.warning : "Success: " + current.title + " posted to Discord!", data.warning ? "bad" : "ok");
      ctrl.clear();
    } else toast("Error: " + (data.error || "Unknown error"), "bad");
  }catch(err){
    toast("Failed to send: " + err.message, "bad");
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
});
window.addEventListener("beforeunload", ()=>{ if(ctrl && current) ctrl.saveDraft(); });

/* ---------- boot: show cached forms instantly, then refresh from Google ---------- */
function apply(cfg){
  CONFIG = cfg;
  if (Portal.setRoster) Portal.setRoster(cfg.roster || []);
  renderHome();
  const h = location.hash.slice(1);
  if(h) go(h);
  else if(current) openForm(current.id);
}
try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if(c) apply(c); }catch(e){}
Portal.loadConfig().then(cfg => {
  const changed = !CONFIG || CONFIG.version !== cfg.version;
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  if(changed) apply(cfg);
}).catch(err => {
  if(!CONFIG) $("formGrid").innerHTML = '<div class="loading">Could not load forms. Check your connection and refresh.<br><small>' + Portal.esc(err.message) + '</small></div>';
});
</script>
</body>
</html>
