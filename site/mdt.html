<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="gate.js?v=1"></script>
<script src="lock.js?v=1"></script>
<meta name="theme-color" content="#0b0f16">
<title>LSPD · Mobile Data Terminal</title>
<link rel="icon" href="img/lspd-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mdt.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4M4 16h16M4 16v2h3v-2M17 16v2h3v-2M7 12h10"/></symbol>
  <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v14"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-steps" viewBox="0 0 24 24"><path d="M4 19h4v-4h4v-4h4V7h4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
  <symbol id="i-gavel" viewBox="0 0 24 24"><path d="M14 4l6 6M11 7l6 6M8.5 9.5l6 6M12.5 5.5l-5 5M18.5 11.5l-5 5M10 14l-6 6"/></symbol>
  <symbol id="i-off" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 6.8a7.5 7.5 0 1 0 10.8 0"/></symbol>
</svg>

<header class="strip">
  <div class="brand"><img src="img/lspd-badge.png" alt=""><div><b>LSPD :: MDT</b><small>MOBILE DATA TERMINAL</small></div></div>
  <div class="unit"><b id="uCs">----</b><span id="uName">Signing on…</span><span class="status"><i></i>10-8 IN SERVICE</span></div>
  <div class="grow"></div>
  <div class="watch" id="watch"></div>
  <div class="clock"><b id="clk">--:--:--</b><small id="clkD"></small></div>
</header>

<div class="wrap">
  <nav class="rail">
    <div class="grp"><div class="lbl">Terminal</div>
      <a class="app" data-go="home"><svg><use href="#i-home"/></svg>Home</a>
      <a class="app" href="index.html"><svg><use href="#i-clip"/></svg>File a report</a>
      <a class="app" href="myreports.html"><svg><use href="#i-file"/></svg>My reports</a>
      <a class="app" data-go="records"><svg><use href="#i-search"/></svg>Records &amp; BOLOs<em id="nBolo"></em></a>
      <a class="app" data-go="reference"><svg><use href="#i-gavel"/></svg>Penal code &amp; 10-codes</a>
    </div>
    <div class="grp"><div class="lbl">Department</div>
      <a class="app" data-go="fleet"><svg><use href="#i-car"/></svg>Fleet<em id="nFleet"></em></a>
      <a class="app" data-go="uniforms"><svg><use href="#i-shirt"/></svg>Uniforms<em id="nUni"></em></a>
      <a class="app" id="sopLink" target="_blank" rel="noopener"><svg><use href="#i-book"/></svg>SOP ↗</a>
      <a class="app" href="division.html" data-need-division hidden><svg><use href="#i-shield"/></svg>Division Command</a>
    </div>
    <div class="me" id="me">Signed on</div>
  </nav>

  <main class="main" id="main"><div class="boot">ESTABLISHING LINK…</div></main>
</div>

<nav class="tabs">
  <a data-go="home"><svg><use href="#i-home"/></svg>HOME</a>
  <a href="index.html"><svg><use href="#i-clip"/></svg>FILE</a>
  <a data-go="records"><svg><use href="#i-search"/></svg>RECORDS</a>
  <a data-go="reference"><svg><use href="#i-gavel"/></svg>CODES</a>
</nav>
<div class="ticker" id="ticker" hidden></div>
<div class="md" id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script src="forms.js?v=1"></script>
<script src="mdt.js?v=1"></script>
</body>
</html>
