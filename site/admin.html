<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LSPD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<style>
  main.adm{max-width:1500px;padding:24px 22px 120px}
  .pill.admin{color:var(--gold);border-color:rgba(242,182,50,.4)}
  .who{font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center}
  .who b{color:var(--text)}
  .btn.sm{padding:8px 12px;font-size:.8rem;border-radius:9px}
  .btn.danger{background:transparent;border:1px solid rgba(255,77,94,.45);color:#ff8a95}
  .btn.danger:hover{background:rgba(255,77,94,.12)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#d99a12);color:#1a1200}
  .ibtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:.85rem;flex:none}
  .ibtn:hover{border-color:var(--blue);color:var(--text)}
  .ibtn.x:hover{border-color:var(--red);color:var(--red)}
  .ibtn:disabled{opacity:.3;cursor:default}

  /* login */
  .login{max-width:400px;margin:60px auto 0}
  .login .sec h2{font-size:1.2rem;margin-bottom:4px}
  .login .sec p{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .login label.f{margin-bottom:14px}
  .login .btn{width:100%}
  .msg{font-size:.85rem;margin-top:12px;color:#ff8a95;min-height:1.2em}

  /* layout */
  .layout{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start}
  nav.side{position:sticky;top:90px;display:grid;gap:4px}
  nav.side button{all:unset;cursor:pointer;padding:11px 14px;border-radius:11px;color:var(--muted);font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center}
  nav.side button:hover{background:var(--panel2);color:var(--text)}
  nav.side button.on{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);color:var(--text)}
  nav.side .sep{height:1px;background:var(--line);margin:8px 4px}
  @media(max-width:900px){.layout{grid-template-columns:1fr} nav.side{position:static;grid-template-columns:repeat(3,1fr)} nav.side .sep{display:none}}

  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h2{font-size:1.35rem}
  .pagehead p{color:var(--muted);font-size:.86rem;flex-basis:100%}
  .pagehead .spacer{flex:1}

  /* tables */
  table.list{width:100%;border-collapse:collapse;font-size:.88rem}
  table.list th{text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.list tr:last-child td{border-bottom:0}
  table.list .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .tablewrap{overflow-x:auto}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--muted)}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);text-transform:uppercase}
  .badge.live{color:var(--green);border-color:rgba(46,204,113,.45)}
  .badge.soon{color:var(--gold);border-color:rgba(242,182,50,.45)}
  .badge.hidden{color:var(--muted)}
  .badge.owner{color:var(--gold);border-color:rgba(242,182,50,.45)}
  .formrow .ic{font-size:1.4rem;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:rgba(47,123,255,.12);border:1px solid rgba(47,123,255,.3)}
  .formrow .t b{display:block}
  .empty-note{color:var(--muted);font-size:.88rem;padding:14px 4px}

  /* editor */
  .editor{display:grid;gap:20px;align-items:start}
  .editor.side{grid-template-columns:minmax(380px,1fr) minmax(380px,1fr)}
  .editor.below,.editor.off{grid-template-columns:minmax(0,860px)}
  .editor.off .preview{display:none}
  .editor>div,.g2>*,.g3>*,label.f,.sub,.blk,details.sec{min-width:0}
  .editor input,.editor select,.editor textarea{max-width:100%;min-width:0}
  .editor.side .g3{grid-template-columns:1fr 1fr}
  .preview{background:var(--bg);box-shadow:-14px 0 24px -18px rgba(0,0,0,.8)}
  .preview{border-radius:12px}
  .editor.side .preview{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
  @media(max-width:1150px){.editor.side{grid-template-columns:minmax(0,860px)} .editor.side .preview{position:static;max-height:none}}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:.78rem;font-weight:700;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:rgba(47,123,255,.18);color:var(--text)}
  .seg button:hover{color:var(--text)}
  #previewMount [data-b]{cursor:pointer}
  #previewMount tbody[data-b]:hover td{box-shadow:inset 0 0 0 999px rgba(47,123,255,.10)}
  #previewMount tbody[data-b].sel td{box-shadow:inset 0 0 0 999px rgba(242,182,50,.16)}
  #previewMount .hud-b{border-radius:20px;transition:outline-color .2s}
  #previewMount .hud-b:hover{outline:2px dashed rgba(47,123,255,.55);outline-offset:5px}
  #previewMount .hud-b.sel{outline:2px solid rgba(242,182,50,.8);outline-offset:5px}
  .blk.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,60%{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,182,50,.35)}100%{border-color:var(--line);box-shadow:none}}
  .fullprev{position:fixed;inset:0;z-index:70;background:rgba(3,6,12,.92);overflow:auto;padding:24px 16px 60px;display:none}
  .fullprev.show{display:block}
  .fullprev .in{max-width:1100px;margin:0 auto}
  .fullprev .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted);font-size:.85rem}
  .preview .ptitle{font-size:.75rem;letter-spacing:.18em;color:var(--muted);margin:0 0 10px;text-transform:uppercase;display:flex;gap:10px;align-items:center}
  details.sec{padding:0}
  details.sec>summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:.82rem;letter-spacing:.16em;color:var(--blue2);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:10px}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:.2s}
  details.sec[open]>summary::after{transform:rotate(90deg)}
  details.sec>.body{padding:0 20px 20px;display:grid;gap:14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
  label.f small{display:block;color:var(--muted);font-size:.74rem;margin-top:5px;line-height:1.4}
  .admin input[type=text],.admin input[type=password],.admin input[type=number],.admin select,.admin textarea{padding:9px 11px;font-size:.88rem;border-radius:9px}
  .admin textarea{min-height:70px}
  input[type=password],input[type=number]{width:100%;background:#0a1120;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px 14px;font:inherit;outline:none}
  input[type=color]{width:100%;height:38px;background:#0a1120;border:1px solid var(--line);border-radius:9px;padding:3px;cursor:pointer}
  .tog{display:flex;align-items:center;gap:10px;font-size:.86rem;cursor:pointer;user-select:none}
  .tog input{width:18px;height:18px;accent-color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:ui-monospace,Consolas,monospace;font-size:.74rem;background:#0a1120;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--blue2);cursor:pointer}
  .chip:hover{border-color:var(--blue)}
  .help{font-size:.8rem;color:var(--muted);line-height:1.5}

  .blk{border:1px solid var(--line);border-radius:12px;background:#0b1323}
  .blk>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px}
  .blk>summary::-webkit-details-marker{display:none}
  .blk .ty{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(47,123,255,.15);color:var(--blue2);flex:none}
  .blk .sm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}
  .blk .bb{padding:4px 12px 14px;display:grid;gap:12px}
  .sub{border:1px dashed #2a3c60;border-radius:10px;padding:12px;display:grid;gap:10px;background:rgba(255,255,255,.015)}
  .subhead{display:flex;align-items:center;gap:6px}
  .subhead b{font-size:.8rem;flex:1;color:var(--muted)}
  .addbar{display:flex;gap:8px;align-items:center}
  .addbar select{flex:1}

  .savebar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);transition:.3s;z-index:40;
    background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.6);max-width:94vw}
  .savebar.show{transform:translate(-50%,0)}
  .savebar span{font-size:.88rem;color:var(--gold);font-weight:600}
  .result{font-size:.82rem;color:var(--muted)}
  .result.ok{color:var(--green)} .result.bad{color:#ff8a95}
  .modal{position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:16px}
  .modal.show{display:grid}
  .modal .sec{width:min(480px,100%);margin:0}
</style>
</head>
<body class="admin">
<div class="lightbar"></div>
<header class="top">
  <div class="top-in" style="max-width:1500px">
    <a class="brand" href="index.html">
      <img class="brand-logo" id="brandLogo" src="img/lspd-patch.png" alt="LSPD">
      <div><b>LSPD</b><small>MANAGE PORTAL</small></div>
    </a>
    <div class="spacer"></div>
    <div class="who" id="who" style="display:none"><span>Signed in as <b id="whoName"></b> <span class="badge" id="whoRole"></span></span><button class="btn ghost sm" id="logoutBtn">Log out</button></div>
    <div class="pill admin" id="adminPill"><span class="dot" style="background:var(--gold);box-shadow:0 0 10px var(--gold)"></span> Admin</div>
  </div>
</header>

<main class="adm">
  <!-- LOGIN -->
  <section id="loginView" class="login" style="display:none">
    <form class="sec" id="loginForm" autocomplete="on">
      <h2>Admin sign-in</h2>
      <p>Manage forms, webhooks and portal settings.</p>
      <label class="f"><span>Username</span><input type="text" id="lgUser" autocomplete="username" required></label>
      <label class="f"><span>Password</span><input type="password" id="lgPass" autocomplete="current-password" required></label>
      <button class="btn primary" id="lgBtn">Sign in</button>
      <div class="msg" id="lgMsg"></div>
    </form>
    <p class="help" style="text-align:center">First time? The Google Sheet owner creates the first account from the sheet menu <b>🚔 LSPD Portal → Create / reset admin account</b>.</p>
  </section>

  <!-- APP -->
  <section id="appView" style="display:none">
    <div class="layout">
      <nav class="side" id="nav">
        <button data-tab="forms">📝 Forms</button>
        <button data-tab="webhooks">🔗 Webhooks</button>
        <button data-tab="settings">⚙️ Portal Settings</button>
        <div class="sep"></div>
        <button data-tab="admins">👮 Admins</button>
        <button data-tab="activity">🕘 Activity Log</button>
        <button data-tab="account">🔑 My Account</button>
      </nav>
      <div id="page"></div>
    </div>
  </section>
  <div class="loading" id="bootMsg">Loading…</div>
</main>

<div class="savebar" id="savebar">
  <span>● Unsaved changes</span>
  <button class="btn ghost sm" id="discardBtn">Discard</button>
  <button class="btn gold sm" id="saveBtn">Save &amp; publish</button>
</div>
<div class="modal" id="modal"><div class="sec" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="forms.js"></script>
<script>
/* =====================================================================
   STATE + API
   ===================================================================== */
const $ = id => document.getElementById(id);
let TOKEN = null;
try { TOKEN = sessionStorage.getItem("lspd_admin_token"); } catch (e) {}
let ME = null, CFG = null, BASE = "", VERSION = 0, HOOKS = [], ADMINS = [], LOG = [];
let TAB = "forms", EDIT = null;           // EDIT = id of form being edited
let PV = "side";                          // preview layout: side | below | off
try { PV = localStorage.getItem("lspd_admin_preview") || "side"; } catch (e) {}
const OPEN = new WeakSet();               // which block cards are expanded

function toast(msg, type) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show " + (type || "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", 4800);
}
async function api(action, data) {
  const res = await Portal.post(Object.assign({ action: action, token: TOKEN }, data || {}));
  if (res.error === "AUTH") { signedOut(res.message); throw new Error(res.message); }
  if (!res.ok) throw new Error(res.message || res.error || "Request failed");
  return res;
}
const clone = o => JSON.parse(JSON.stringify(o));
function isDirty() { return CFG && JSON.stringify(CFG) !== BASE; }
function dirty() { $("savebar").classList.toggle("show", isDirty()); }

/* =====================================================================
   DOM HELPERS
   ===================================================================== */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  });
  kids.flat(Infinity).forEach(k => { if (k == null || k === false) return; el.append(k.nodeType ? k : document.createTextNode(k)); });
  return el;
}
function field(label, control, hint) {
  return h("label", { class: "f" }, h("span", { text: label }), control, hint ? h("small", { text: hint }) : null);
}
// bound inputs: write straight into the config object, then refresh preview / save bar
function bind(obj, key, opts) {
  opts = opts || {};
  let el;
  if (opts.type === "textarea") el = h("textarea", { rows: opts.rows || 3, placeholder: opts.placeholder });
  else if (opts.type === "select") {
    el = h("select", {}, opts.options.map(o => h("option", { value: o[0], text: o[1] })));
  } else el = h("input", { type: opts.type || "text", placeholder: opts.placeholder, maxlength: opts.max });
  const get = opts.get || (v => v == null ? "" : v), set = opts.set || (v => v);
  el.value = get(obj[key]);
  el.addEventListener(opts.type === "select" ? "change" : "input", () => {
    obj[key] = set(el.value);
    if (opts.reflect && el.value !== get(obj[key])) el.value = get(obj[key]);
    changed(opts.structural);
  });
  return el;
}
function toggle(obj, key, label, structural) {
  const cb = h("input", { type: "checkbox", checked: !!obj[key], onchange: () => { obj[key] = cb.checked; changed(structural); } });
  return h("label", { class: "tog" }, cb, label);
}
const linesGet = v => (v || []).join("\n");
const linesSet = v => v.split("\n").map(s => s.trim()).filter(Boolean);

let previewTimer;
function changed(structural) {
  dirty();
  if (structural) renderPage(true);
  else { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 250); }
}
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function ctrls(arr, i, opts) {
  opts = opts || {};
  const stop = fn => e => { e.preventDefault(); e.stopPropagation(); fn(); };
  return h("span", { style: "display:flex;gap:4px" },
    h("button", { type: "button", class: "ibtn", title: "Move up", disabled: i === 0, onclick: stop(() => { move(arr, i, -1); changed(true); }) }, "↑"),
    h("button", { type: "button", class: "ibtn", title: "Move down", disabled: i === arr.length - 1, onclick: stop(() => { move(arr, i, 1); changed(true); }) }, "↓"),
    opts.dup ? h("button", { type: "button", class: "ibtn", title: "Duplicate", onclick: stop(() => { arr.splice(i + 1, 0, opts.dup(arr[i])); changed(true); }) }, "⧉") : null,
    h("button", { type: "button", class: "ibtn x", title: "Remove", onclick: stop(() => { if (!opts.confirm || confirm(opts.confirm)) { arr.splice(i, 1); changed(true); } }) }, "✕"));
}
function modal(build) {
  const body = $("modalBody"); body.innerHTML = "";
  const close = () => $("modal").classList.remove("show");
  body.append(build(close));
  $("modal").classList.add("show");
  const first = body.querySelector("input,select,textarea"); if (first) first.focus();
}
$("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").classList.remove("show"); });

/* =====================================================================
   AUTH + LOADING
   ===================================================================== */
function signedOut(msg) {
  TOKEN = null; try { sessionStorage.removeItem("lspd_admin_token"); } catch (e) {}
  $("appView").style.display = "none"; $("who").style.display = "none"; $("bootMsg").style.display = "none";
  $("loginView").style.display = ""; $("lgMsg").textContent = msg || ""; $("lgUser").focus();
  $("savebar").classList.remove("show");
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("lgBtn").disabled = true; $("lgMsg").textContent = "";
  try {
    const res = await Portal.post({ action: "login", username: $("lgUser").value.trim(), password: $("lgPass").value });
    if (!res.ok) throw new Error(res.error);
    TOKEN = res.token; try { sessionStorage.setItem("lspd_admin_token", TOKEN); } catch (e) {}
    $("lgPass").value = "";
    await loadAll();
  } catch (err) { $("lgMsg").textContent = err.message; }
  finally { $("lgBtn").disabled = false; }
});
$("logoutBtn").onclick = async () => {
  if (isDirty() && !confirm("You have unsaved changes. Log out anyway?")) return;
  try { await api("logout"); } catch (e) {}
  CFG = null; signedOut("Signed out.");
};

async function loadAll(keepEdits) {
  const res = await api("getAll");
  ME = res.me; HOOKS = res.webhooks; ADMINS = res.admins; LOG = res.log;
  showBackendWarning(res.backend || 0);
  if (!keepEdits) {
    CFG = res.config; VERSION = res.config.version;
    CFG.forms = CFG.forms.map(f => Portal.withDefaults(f));   // built-in guides for forms saved before guides existed
    BASE = JSON.stringify(CFG);
  }
  $("loginView").style.display = "none"; $("bootMsg").style.display = "none"; $("appView").style.display = "";
  $("who").style.display = ""; $("whoName").textContent = ME.username;
  $("whoRole").textContent = ME.role; $("whoRole").className = "badge " + (ME.role === "owner" ? "owner" : "");
  if (EDIT && !CFG.forms.some(f => f.id === EDIT)) EDIT = null;
  dirty(); renderPage();
}

// Google is running an older WebApp.gs than this website needs -> saves can lose new settings.
function showBackendWarning(have) {
  let el = $("backendWarn");
  if (have >= Portal.BACKEND_NEEDS) { if (el) el.remove(); return; }
  if (!el) {
    el = h("div", { id: "backendWarn", class: "maint", style: "text-align:left;margin-bottom:18px" });
    $("appView").prepend(el);
  }
  el.innerHTML = "";
  el.append(h("b", { text: "⚠️ Your Google Apps Script is out of date " }), "(running version " + (have || "1") + ", this site needs " + Portal.BACKEND_NEEDS + "). " +
    "Some settings, like newer looks, will reset when you save. Fix: paste the latest WebApp.gs into Extensions → Apps Script, then Deploy → Manage deployments → pencil → New version → Deploy, and reload this page.");
}

$("saveBtn").onclick = async () => {
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const res = await Portal.post({ action: "saveConfig", token: TOKEN, config: CFG, baseVersion: VERSION });
    if (res.error === "AUTH") { signedOut(res.message); return; }
    if (res.error === "CONFLICT") {
      if (confirm(res.message + "\n\nReload now?")) await loadAll();
      return;
    }
    if (!res.ok) throw new Error(res.error);
    const editIndex = EDIT ? CFG.forms.findIndex(f => f.id === EDIT) : -1;
    CFG = res.config; VERSION = CFG.version; BASE = JSON.stringify(CFG);
    if (editIndex > -1 && CFG.forms[editIndex]) EDIT = CFG.forms[editIndex].id;
    dirty(); renderPage(true);
    toast("Saved. The live portal now shows these changes.", "ok");
    loadAll(true).catch(() => {});  // refresh activity log
  } catch (err) { toast(err.message, "bad"); }
  finally { btn.disabled = false; btn.textContent = "Save & publish"; }
};
$("discardBtn").onclick = () => {
  if (!confirm("Throw away all unsaved changes?")) return;
  CFG = JSON.parse(BASE);
  if (EDIT && !CFG.forms.some(f => f.id === EDIT)) EDIT = null;
  dirty(); renderPage();
};
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* =====================================================================
   PAGES
   ===================================================================== */
$("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  TAB = b.dataset.tab; if (TAB !== "forms") EDIT = null; renderPage();
});
function renderPage(keepScroll) {
  const y = window.scrollY;
  document.querySelectorAll("#nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const page = $("page"); page.innerHTML = "";
  ({ forms: EDIT ? pageEditor : pageForms, webhooks: pageWebhooks, settings: pageSettings, admins: pageAdmins, activity: pageActivity, account: pageAccount })[TAB](page);

    h("div", { class: "chips" }, refs.map(r => h("span", { class: "chip", text: r }))));

    field("Sentence starter", bind(st, "starter", { type: "textarea", rows: 2 })))));
  box.append(h("div", {}, h("button", { class: "btn ghost sm", onclick: () => { g.steps.push({ label: "New step", help: "", starter: "" }); changed(true); } }, "+ Add step")));
  box.append(field("Tips (one per line)", bind(g, "tips", { type: "textarea", rows: 4, get: linesGet, set: linesSet })));
  box.append(field("Must mention (one per line:  Label | {reference})", bind(g, "mention", { type: "textarea", rows: 2,
    get: v => (v || []).map(m => m.label + " | " + m.ref).join("\n"),
    set: v => linesSet(v).map(l => { const p = l.split("|"); return { label: p[0].trim(), ref: (p[1] || "").trim() }; }).filter(m => m.label && m.ref) }),
    "Ticks green once every value appears in the text, e.g. Names every suspect | {persons.name?role=Suspect}"));
  box.append(field("Keyword checks (one per line:  Label | word, other word)", bind(g, "keywords", { type: "textarea", rows: 2,
    get: v => (v || []).map(k => k.label + " | " + (k.words || []).join(", ")).join("\n"),
    set: v => linesSet(v).map(l => { const p = l.split("|"); return { label: p[0].trim(), words: (p[1] || "").split(",").map(w => w.trim()).filter(Boolean) }; }).filter(k => k.label && k.words.length) }),
    "Ticks green when any of the words appear, e.g. Miranda noted | miranda"));

}

function renderPreview() {
  const mount = $("previewMount");
  if (!mount) return;
  const form = CFG.forms.find(f => f.id === EDIT);
  if (!form) return;
  try {
    Portal.render(form, mount, { draft: false });
    if (!(form.blocks || []).length) mount.innerHTML = '<div class="empty-note">Add a block to see the form.</div>';
    fitPreview();
  } catch (e) { mount.innerHTML = '<div class="empty-note">Preview error: ' + Portal.esc(e.message) + '</div>'; }
}
// shrink the 780px-wide sheet to fit the preview column instead of scrolling sideways
function fitPreview() {
  const mount = $("previewMount"), wrap = mount && mount.querySelector(".paper-wrap");
  if (!wrap) return;
  wrap.style.zoom = "";
  if (wrap.classList.contains("theme-hud")) return; // the HUD look reflows itself, no shrinking needed
  const z = Math.min(1, (mount.clientWidth - 2) / 800);
  if (z < 1) wrap.style.zoom = z.toFixed(3);
}
window.addEventListener("resize", () => { clearTimeout(fitPreview._t); fitPreview._t = setTimeout(fitPreview, 150); });

// click a part of the preview -> open that block's settings
function jumpToBlock(e) {
  const tb = e.target.closest("[data-b]");
  if (!tb) return;
  e.preventDefault();
  const i = Number(tb.dataset.b), form = CFG.forms.find(f => f.id === EDIT), b = form && form.blocks[i];
  if (!b) return;
  document.querySelectorAll("#previewMount .sel").forEach(x => x.classList.remove("sel"));
  tb.classList.add("sel");
  const sec = $("blocksSec"); if (sec) sec.open = true;
  const card = document.querySelector('details.blk[data-bi="' + i + '"]');
  if (!card) return;
  OPEN.add(b); card.open = true;
  card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  card.scrollIntoView({ behavior: "smooth", block: "start" });
  const first = card.querySelector(".bb input, .bb textarea, .bb select");
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 400);
}

function exportForm(form) {
  const text = JSON.stringify(form, null, 2);
  modal(close => {
    const ta = h("textarea", { rows: 14, readonly: true, style: "font-family:ui-monospace,Consolas,monospace;font-size:.75rem" });
    ta.value = text;
    const copy = h("button", { type: "button", class: "btn primary", onclick: async () => {
      try { await navigator.clipboard.writeText(text); } catch (e) { ta.select(); document.execCommand("copy"); }
      toast("Form copied. Keep it somewhere safe as a backup.", "ok"); close();
    } }, "Copy to clipboard");
    return h("div", { style: "display:grid;gap:14px" }, h("h3", { text: "Export: " + form.title }),
      h("p", { class: "help", text: "This is the complete form. Paste it into Import on any form to copy it, or keep it as a backup before big changes." }),
      ta, h("div", { class: "actions", style: "margin-top:0" }, h("button", { type: "button", class: "btn ghost", onclick: close }, "Close"), copy));
  });
}
function importForm(form) {
  modal(close => {
    const ta = h("textarea", { rows: 14, placeholder: "Paste an exported form here…", style: "font-family:ui-monospace,Consolas,monospace;font-size:.75rem" });
    const keepId = h("input", { type: "checkbox", checked: true });
    const msg = h("div", { class: "msg" });
    return h("form", { style: "display:grid;gap:14px", onsubmit: e => {
      e.preventDefault();
      let data;
      try { data = JSON.parse(ta.value.trim()); } catch (err) { msg.textContent = "That isn't a valid export (the text must start with { and end with })."; return; }
      if (!data || typeof data !== "object" || !Array.isArray(data.blocks) || !data.title) { msg.textContent = "That doesn't look like a form export (no title or blocks)."; return; }
      if (!confirm("Replace everything in \"" + form.title + "\" with the pasted form? (Nothing is live until you press Save & publish.)")) return;
      const id = form.id;
      Object.keys(form).forEach(k => delete form[k]);
      Object.assign(form, data);
      if (keepId.checked || !data.id || CFG.forms.some(f => f !== form && f.id === data.id)) form.id = id;
      EDIT = form.id; close(); changed(true);
      toast("Imported. Check the preview, then Save & publish.", "ok");
    } },
      h("h3", { text: "Import into: " + form.title }),
      h("p", { class: "help", text: "Replaces this form's layout and settings with a pasted export. You can review it in the preview before publishing, or press Discard to undo." }),
      ta, h("label", { class: "tog" }, keepId, "Keep this form's ID (" + form.id + ") so its link, drafts and sheet tab stay the same"),
      h("div", { class: "actions", style: "margin-top:0" }, h("button", { type: "button", class: "btn ghost", onclick: close }, "Cancel"), h("button", { class: "btn primary" }, "Import")), msg);
  });
}

function fullPreview(form) {
  let fp = $("fullprev");
  if (!fp) {
    fp = h("div", { class: "fullprev", id: "fullprev" },
      h("div", { class: "in" },
        h("div", { class: "bar" }, h("b", { id: "fpTitle", style: "color:var(--text);font-size:1rem" }), h("span", { class: "spacer", style: "flex:1" }),
          "Press Esc to close", h("button", { class: "btn ghost sm", onclick: () => fp.classList.remove("show") }, "✕ Close")),
        h("div", { id: "fpMount" })));

/* ---------------- WEBHOOKS ---------------- */
function pageWebhooks(page) {
  page.append(head("Webhooks", "Discord webhook URLs are stored privately in Google (never on the website or GitHub). Changes here save immediately. To get a URL: Discord channel → Edit Channel → Integrations → Webhooks → New Webhook → Copy Webhook URL.",
    h("button", { class: "btn primary sm", onclick: () => webhookModal(null) }, "+ Add webhook")));
  const body = h("div", { class: "sec" });
  if (!HOOKS.length) body.append(h("div", { class: "empty-note", text: "No webhooks yet." }));
  else {
    const tbl = h("table", { class: "list" }, h("tr", {}, ["Name", "Channel type", "Used by", "URL", ""].map(t => h("th", { text: t }))));
    HOOKS.forEach(w => {
      const users = CFG.forms.filter(f => f.webhookId === w.id).map(f => f.title)
        .concat(CFG.forms.filter(f => f.leaderboard && f.leaderboard.enabled && f.leaderboard.webhookId === w.id).map(f => f.title + " leaderboard"));
      const result = h("div", { class: "result" });
      const test = async send => {
        result.className = "result"; result.textContent = send ? "Sending…" : "Checking…";
        try { const r = await api("webhookTest", { id: w.id, send: send }); result.className = "result " + (r.valid ? "ok" : "bad"); result.textContent = r.message; }
        catch (e) { result.className = "result bad"; result.textContent = e.message; }
      };
      tbl.append(h("tr", {},
        h("td", {}, h("b", { text: w.name }), h("div", { class: "mono", text: w.id }), result),
        h("td", { text: w.kind === "text" ? "Text channel" : "Forum" }),
        h("td", { class: "help", text: users.join(", ") || "—" }),
        h("td", { class: "mono", text: w.hint }),
        h("td", {}, h("div", { class: "acts" },
          h("button", { class: "btn ghost sm", onclick: () => test(false) }, "Check"),
          h("button", { class: "btn ghost sm", onclick: () => { if (confirm("Post a test message to " + w.name + "?")) test(true); } }, "Send test"),
          h("button", { class: "btn ghost sm", onclick: () => webhookModal(w) }, "Edit"),
          h("button", { class: "btn danger sm", onclick: async () => {
            if (!confirm("Delete webhook \"" + w.name + "\"?")) return;
            try { HOOKS = (await api("webhookDelete", { id: w.id })).webhooks; toast("Webhook deleted.", "ok"); renderPage(true); } catch (e) { toast(e.message, "bad"); }
          } }, "Delete")))));
    });
    body.append(h("div", { class: "tablewrap" }, tbl));
  }
  page.append(body);
}
function webhookModal(w) {
  modal(close => {
    const name = h("input", { type: "text", value: w ? w.name : "", maxlength: 60, placeholder: "e.g. CID Forum" });
    const kind = h("select", {}, h("option", { value: "forum", text: "Forum channel (creates a thread per submission)" }), h("option", { value: "text", text: "Text channel (plain messages, e.g. leaderboard)" }));
    kind.value = w ? w.kind : "forum";
    const url = h("input", { type: "password", autocomplete: "off", placeholder: w ? "Leave blank to keep the current URL" : "https://discord.com/api/webhooks/…" });
    const msg = h("div", { class: "msg" });
    const btn = h("button", { class: "btn primary" }, w ? "Save" : "Add webhook");
    const f = h("form", { style: "display:grid;gap:14px", onsubmit: async e => {
      e.preventDefault(); btn.disabled = true; msg.textContent = "Checking with Discord…"; msg.style.color = "var(--muted)";
      try {
        const r = await api("webhookSave", { webhook: { id: w && w.id, name: name.value, kind: kind.value, url: url.value.trim() } });
        HOOKS = r.webhooks; close(); toast("Webhook saved" + (r.discordName ? " (posts as \"" + r.discordName + "\")" : "") + ".", "ok"); renderPage(true);
      } catch (err) { msg.style.color = ""; msg.textContent = err.message; }
      btn.disabled = false;
    } },
      h("h3", { text: w ? "Edit webhook" : "Add webhook", style: "font-size:1.05rem" }),
      field("Name (just for you)", name), field("Channel type", kind), field("Webhook URL", url, "Hidden as you paste. It's checked with Discord before saving."),
      h("div", { class: "actions", style: "margin-top:0" }, h("button", { type: "button", class: "btn ghost", onclick: close }, "Cancel"), btn), msg);
    return f;
  });
}

  const tbl = h("table", { class: "list" }, h("tr", {}, ["Username", "Role", "Last login", ""].map(t => h("th", { text: t }))));
  ADMINS.forEach(a => {
    const role = h("select", { style: "width:auto" }, h("option", { value: "admin", text: "Admin" }), h("option", { value: "owner", text: "Owner" }));

    role.onchange = async () => {

      catch (e) { toast(e.message, "bad"); role.value = a.role; }

      h("td", {}, h("b", { text: a.username }), a.username === ME.username ? h("span", { class: "mono", text: "  (you)" }) : null),
