# Uploads everything in /site to InfinityFree's htdocs folder on every push to main.
# Only changed files are uploaded (the action keeps a small state file on the server).
#
# Required repo secrets (Settings > Secrets and variables > Actions > New repository secret):
#   FTP_SERVER    e.g. ftpupload.net        (InfinityFree control panel > FTP Details > FTP Hostname)
#   FTP_USERNAME  e.g. if0_12345678         (FTP Username)
#   FTP_PASSWORD  your hosting account password (FTP Password, "Show")

name: Deploy to InfinityFree

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Stamp file versions so browsers fetch the new files
        run: sed -i -E "s/(portal\.css|forms\.js|templates\.js)\?v=[0-9a-z]+/\1?v=${GITHUB_SHA::8}/g" site/index.html site/admin.html

      - name: Upload site/ to htdocs over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/
          server-dir: /htdocs/
          timeout: 120000
