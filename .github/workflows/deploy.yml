# The portal is now hosted on Cloudflare Pages (https://lspdisthebest.net), which builds
# straight from this repo on every push (Build command: sh build.sh · Output directory: site).
#
# This workflow only keeps the OLD InfinityFree address working: it uploads the small
# infinityfree/ folder (a redirect) to htdocs, so old links land on the new site.
# It runs when that folder changes, or by hand from the Actions tab.
#
# Repo secrets it uses (already set): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Redirect old InfinityFree address

on:
  push:
    branches: [main]
    paths: ["infinityfree/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Upload the redirect to htdocs over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./infinityfree/
          server-dir: /htdocs/
          timeout: 120000
